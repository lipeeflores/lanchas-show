version: '3.9'

services:
  evolution_db:
    image: postgres:15-alpine
    container_name: evolution_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: evolution
    ports:
      - "54321:5432"
    volumes:
      - evolution_db_data:/var/lib/postgresql/data

  evolution_redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    volumes:
      - evolution_redis_data:/data

  evolution-api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - evolution_db
      - evolution_redis
    environment:
      # Server configurations
      - PORT=8080
      - SERVER_URL=http://localhost:8080
      
      # Authentication
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=429643a637c6883135f28a8d193d1e6
      
      # Global Webhook configuration pointing to our local backend
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://host.docker.internal:3001/api/whatsapp/webhook
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      
      # Enable all required WhatsApp events
      - WEBHOOK_EVENTS_APPLICATION_STARTUP=true
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_MESSAGES_SET=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=true
      - WEBHOOK_EVENTS_SEND_MESSAGE=true
      - WEBHOOK_EVENTS_CONNECTION_ACTIVE=true
      
      # DB Metadata caching
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://root:securepassword@evolution_db:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=lanchas_show
      - DATABASE_SAVE_DATA_CHATS=false
      - DATABASE_SAVE_DATA_CONTACTS=false
      - DATABASE_SAVE_DATA_HISTORIC=false
      - DATABASE_SAVE_DATA_LABELS=false
      
      # Redis Cache configuration
      - REDIS_ENABLED=true
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution_redis:6379


    volumes:
      - evolution_instances:/evolution/instances
    # Enable host.docker.internal resolution on linux/windows environments
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  evolution_instances:
  evolution_db_data:
  evolution_redis_data:
